<body><form action="post">  <h1>Sign Up Form</h1>

<input type="checkbox" id="subject">Data Science <br>
<input type="checkbox" id="subject">Web Development <br>
<input type="checkbox" id="subject">Machine Learning <br>

<br>
<input type="submit" value="submit" >  &nbsp;

</form>
  

</body>
